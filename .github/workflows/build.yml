name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Build
        run: buildozer android debug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: movieway-apk
          path: bin/*.apk
