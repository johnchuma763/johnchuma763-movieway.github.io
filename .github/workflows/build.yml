name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip libffi-dev libssl-dev libtinfo5 libncurses5-dev libncursesw5-dev zlib1g-dev autoconf libtool pkg-config cmake
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build APK (first run downloads SDK)
        run: |
          yes | buildozer android debug || true
          ls ~/.buildozer/android/platform/android-sdk/build-tools/ || true

      - name: Install AIDL fix
        run: |
          SDK=~/.buildozer/android/platform/android-sdk
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "platform-tools" "platforms;android-33" || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ls $SDK/build-tools/33.0.2/aidl

      - name: Build APK (second run real build)
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movieway-apk
          path: bin/*.apk
